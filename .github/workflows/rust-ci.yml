# Rust CI for the OTel Collector (Pod 2).
#
# Scoped to the Rust subtree per the polyglot-monorepo rule in
# .claude/docs/RUST_PROJECT_STANDARDS.md: a Python-only or docs-only PR does not
# trigger Rust builds, and vice versa. The Rust toolchain version is pinned by
# services/collector-rust/rust-toolchain.toml (1.96.0) — every cargo invocation
# in that directory auto-installs it.
#
# Maps to the Crew B 7-gate WoW:
#   linter      → cargo clippy -D warnings        (job: gates)
#   type check  → cargo build                     (job: gates, implicit)
#   tests       → cargo test + the CH round-trip   (jobs: gates, integration)
#   security    → cargo deny check                 (job: supply-chain)
#   build       → cargo build --release             (job: gates)
#   docker build→ docker build (distroless image)   (job: docker-build)
# (markdownlint and CodeRabbit are separate, language-agnostic gates.)
#
# Lean default (cheap on every PR, heavy weekly/manual):
#   pull_request / push main (Rust paths) -> gates (fmt · clippy · test) +
#     supply-chain (cargo deny).
#   weekly (Mon 06:00 UTC) + workflow_dispatch -> also release build,
#     ClickHouse integration round-trip, and the distroless docker build.

name: rust-ci

on:
  pull_request:
    paths:
      - "services/collector-rust/**"
      - "infra/**"
      - ".github/workflows/rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/collector-rust/**"
      - "infra/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly heavy gates

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── fmt · clippy · unit/golden tests · release build ──────────────────────
  gates:
    name: gates (fmt · clippy · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/collector-rust

      # Triggers rustup to install the rust-toolchain.toml pin + components.
      - name: Install pinned toolchain
        working-directory: services/collector-rust
        run: rustup show

      - name: Format check
        working-directory: services/collector-rust
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        working-directory: services/collector-rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Runs unit + golden-parse + doc tests. The ClickHouse round-trip is
      # #[ignore]d here (no DB in this job) and runs in the `integration` job.
      - name: Tests (non-ignored)
        working-directory: services/collector-rust
        run: cargo test --locked

  # ── temporary evidence for DEC-A4; it must not select a TLS design ───────
  musl-tls-spike:
    name: musl TLS spike (${{ matrix.target }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/collector-rust
      - name: Install pinned toolchain and target
        working-directory: services/collector-rust
        run: rustup show
      - name: Compile static TLS experiment
        working-directory: services/collector-rust
        run: cargo build --release --locked --features tls-spike --target ${{ matrix.target }}
      - name: Verify static linkage
        working-directory: services/collector-rust
        run: file target/${{ matrix.target }}/release/sentinel-collector | grep -q "statically linked"

  # ── live round-trip against a real ClickHouse ─────────────────────────────
  #
  # Runs EVERY #[ignore]d test, not one named target. The previous
  # `--test clickhouse_roundtrip` filter meant
  # tests/grpc_export_roundtrip.rs's otlp_grpc_payload_lands_in_clickhouse ran
  # nowhere: the gRPC ingest path — the only path that drives the silver MVs
  # under real inserts — had zero live coverage, and the whole silver lane rests
  # on it. The orphan check below is what keeps that from recurring.
  integration:
    name: integration (every #[ignore]d test)
    # Lean default (PR #59): this job needs a live ClickHouse service, so it runs
    # weekly + on demand, not on every PR. See docs/ci-gates.md.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLICKHOUSE_URL: http://localhost:8123
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/collector-rust

      - name: Install pinned toolchain
        working-directory: services/collector-rust
        run: rustup show

      # Reuses the same compose the team runs locally — the DDL auto-applies via
      # the initdb volume mount, and --wait blocks on the healthcheck.
      - name: Start ClickHouse
        run: docker compose -f services/collector-rust/infra/docker-compose.yml up -d --wait

      # Every #[ignore]d test in every target. No --test filter: a filter is how
      # the gRPC round-trip came to run nowhere. The log is kept for the orphan
      # check below, which asserts against what actually ran.
      - name: Live tests (all #[ignore]d)
        working-directory: services/collector-rust
        run: |
          set -o pipefail
          cargo test --locked -- --ignored 2>&1 | tee "$RUNNER_TEMP/ignored.log"

      # Fails if a test is #[ignore]d in tests/*.rs and did not appear in that
      # run. Checking the LOG rather than `--list` is deliberate: it catches a
      # reintroduced `--test <target>` filter, which is the exact regression
      # this ticket repairs, and a `--list` would answer about a different
      # invocation than the one that ran.
      - name: No orphaned #[ignore]d tests
        working-directory: services/collector-rust
        run: |
          declared="$(
            awk '/^[[:space:]]*#\[ignore/ {f=1; next}
                 f && match($0, /fn [a-z0-9_]+/) {
                   print substr($0, RSTART + 3, RLENGTH - 3); f = 0
                 }' tests/*.rs | sort -u
          )"
          ran="$(
            sed -n 's/^test \([a-z0-9_:]*\) \.\.\. ok$/\1/p' "$RUNNER_TEMP/ignored.log" |
              sed 's/.*:://' | sort -u
          )"
          echo "declared #[ignore]d in tests/*.rs:"; printf '%s\n' "$declared" | sed 's/^/  /'
          echo "ran in the step above:";             printf '%s\n' "$ran"      | sed 's/^/  /'

          if [ -z "$declared" ]; then
            echo "::error::no #[ignore]d test found in tests/*.rs — the detector is broken"
            exit 1
          fi

          orphans="$(comm -23 <(printf '%s\n' "$declared") <(printf '%s\n' "$ran"))"
          if [ -n "$orphans" ]; then
            echo "::error::#[ignore]d tests that CI does not run:"
            printf '%s\n' "$orphans" | sed 's/^/  /'
            exit 1
          fi

          # Every integration target must have been attempted, not just the one
          # holding a live test today.
          targets="$(ls tests/*.rs | wc -l | tr -d ' ')"
          attempted="$(grep -cE '^ *Running tests/' "$RUNNER_TEMP/ignored.log" || true)"
          echo "integration targets: $targets declared, $attempted attempted"
          if [ "$attempted" -ne "$targets" ]; then
            echo "::error::$attempted of $targets integration targets attempted"
            exit 1
          fi
          echo "no orphans"

      - name: Tear down ClickHouse
        if: always()
        run: docker compose -f services/collector-rust/infra/docker-compose.yml down -v

  # ── advisories + licenses + bans (cargo-deny) ─────────────────────────────
  supply-chain:
    name: supply-chain (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: services/collector-rust/Cargo.toml
          command: check
          arguments: --all-features

  # ── distroless image builds (WoW "Docker build" gate) ─────────────────────
  # ── release build (weekly / manual) ───────────────────────────────────────
  release-build:
    name: release build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/collector-rust

      - name: Install pinned toolchain
        working-directory: services/collector-rust
        run: rustup show

      - name: Release build
        working-directory: services/collector-rust
        run: cargo build --release --locked

  docker-build:
    name: docker-build (distroless image)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the collector image
        uses: docker/build-push-action@v6
        with:
          context: services/collector-rust
          platforms: linux/amd64,linux/arm64
          push: false
          tags: sentinel-collector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
