# Sentinel Knowledge Base Index
# Machine-readable registry for KB domains.
# Consumed by /create-kb, /enrich-kb, /update-kbs, and kb-architect.

version: "1.0"
last_updated: "2026-06-01"
project: sentinel

# File-size limits (single source of truth — enforced by /create-kb + reviewers)
limits:
  quick_reference: 100
  concept: 150
  pattern: 200
  spec: null
  reference: null

# Templates (canonical shapes — kb-architect copies from these)
templates:
  - name: index
    path: _templates/index.md.template
  - name: quick-reference
    path: _templates/quick-reference.md.template
  - name: concept
    path: _templates/concept.md.template
  - name: pattern
    path: _templates/pattern.md.template
  - name: domain-manifest
    path: _templates/domain-manifest.yaml.template

# Confidence scoring scale (mirrors /enrich-kb skill)
confidence_scale:
  "0.95": "KB + MCP agree; matches official docs"
  "0.85": "MCP-validated only (newer than local KB)"
  "0.75": "KB-only (no recent re-validation)"
  "0.50": "Conflict between sources; needs human review"

