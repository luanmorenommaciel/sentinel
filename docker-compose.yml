# Sentinel monorepo — Rust end-to-end pipeline.
#
#   generator (otelgen) ──OTLP gRPC :4317──▶ collector-rust ──HTTP──▶ ClickHouse :8123

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    # The Rust collector uses the passwordless `default` user over HTTP :8123.
    # The init script creates the bronze database without changing that dev-only auth.
    ports:
      - "8123:8123"   # HTTP interface (+ /play UI) — Rust exporter
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/clickhouse-users.d/zz-default-network.xml:/etc/clickhouse-server/users.d/zz-default-network.xml:ro
      # POD 3 canonical bronze schema (bronze.* contrib-style) — auto-applied on first boot.
      # The collector writes this split schema directly (ADR-0007); the tables must
      # exist before it connects, so they are created here on boot.
      - ./infra/clickhouse/init.d/01-bronze-otel.sql:/docker-entrypoint-initdb.d/02-bronze-otel.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/?query=SELECT+1"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector-rust:
    build:
      context: ./services/collector-rust
    image: sentinel-collector-rust:dev
    # Pass the runtime config (grpc + clickhouse sections) as argv[1] → SERVER mode.
    command: ["/etc/sentinel/config.yaml"]
    environment:
      CONTRACTS_DIR: /contracts/generator/v1
      CLICKHOUSE_URL: "http://clickhouse:8123"
    volumes:
      - ./contracts:/contracts:ro
      - ./services/collector-rust/config.docker.yaml:/etc/sentinel/config.yaml:ro
    ports:
      - "4317:4317"
      - "9090:9090"   # Prometheus collector metrics
    networks:
      default:
        aliases: ["collector"]
    depends_on:
      clickhouse:
        condition: service_healthy

  generator:
    build:
      context: ./services/generator-python
    image: sentinel-generator:dev
    environment:
      CONTRACTS_DIR: /contracts/generator/v1
    volumes:
      - ./contracts:/contracts:ro
    # No long-running command — driven on demand by `make generate`
    # (docker compose run --rm generator run --scenario ... --otlp-endpoint http://collector:4317).

volumes:
  clickhouse_data: {}
