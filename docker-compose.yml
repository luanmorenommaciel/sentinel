# Sentinel monorepo — configurable end-to-end pipeline.
#
#   generator (otelgen) ──OTLP gRPC :4317──▶ collector (rust | go) ──▶ ClickHouse :8123/:9000
#
# Exactly ONE collector runs per invocation (both bind :4317). Select it with the
# `rust` or `go` Compose profile, driven by the root Makefile's COLLECTOR variable:
#
#   make up COLLECTOR=rust      # or: COMPOSE_PROFILES=rust docker compose up -d
#   make up COLLECTOR=go
#
# Both collectors expose the network alias `collector`, so the generator always
# targets http://collector:4317 regardless of which one is active.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      # Go collector connects as otelgen@9000/sentinel (its CLICKHOUSE_DSN default).
      # The `default` user remains (no password) for the Rust collector over HTTP :8123.
      CLICKHOUSE_DB: sentinel
      CLICKHOUSE_USER: otelgen
      CLICKHOUSE_PASSWORD: otelgen_secret
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP interface (+ /play UI) — Rust exporter
      - "9000:9000"   # native TCP — Go exporter
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/?query=SELECT+1"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["rust", "go"]   # member of both — always up

  collector-rust:
    build:
      context: ./services/collector-rust
    image: sentinel-collector-rust:dev
    environment:
      CONTRACTS_DIR: /contracts/v1
      CH_URL: "http://clickhouse:8123"
    volumes:
      - ./contracts:/contracts:ro
    ports:
      - "4317:4317"
    networks:
      default:
        aliases: ["collector"]
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles: ["rust"]

  collector-go:
    build:
      context: ./services/collector-go
    image: sentinel-collector-go:dev
    environment:
      CONTRACTS_DIR: /contracts/v1
      GRPC_PORT: "4317"
      CLICKHOUSE_DSN: "clickhouse://otelgen:otelgen_secret@clickhouse:9000/sentinel"
    volumes:
      - ./contracts:/contracts:ro
    ports:
      - "4317:4317"
    networks:
      default:
        aliases: ["collector"]
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles: ["go"]

  generator:
    build:
      context: ./services/generator-python
    image: sentinel-generator:dev
    environment:
      CONTRACTS_DIR: /contracts/v1
    volumes:
      - ./contracts:/contracts:ro
    # No long-running command — driven on demand by `make generate`
    # (docker compose run --rm generator run --scenario ... --otlp-endpoint http://collector:4317).
    profiles: ["rust", "go"]

volumes:
  clickhouse_data: {}
