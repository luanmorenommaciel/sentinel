# Sentinel monorepo — Rust end-to-end pipeline.
#
#   generator (otelgen) ──OTLP gRPC :4317──▶ collector-rust ──HTTP──▶ ClickHouse :8123

# ClickHouse comes from the one definition in the repository (REQ-I-02, REQ-I-08);
# `make up` is still a single step. Relative mounts inside the included file resolve
# against its own directory, so the DDL paths do not need restating here.
#
# The `infra/clickhouse-init.sql` and `infra/clickhouse-users.d/` mounts went with
# the inline service. **That reverts `default` to localhost-only**, so the
# collector's export stays broken until T18 moves consumers onto roles; this ticket
# is green as a Compose-config change and runtime green is T19's.
include:
  - infra/clickhouse/compose.clickhouse.yml

services:
  collector-rust:
    build:
      context: ./services/collector-rust
    image: sentinel-collector-rust:dev
    # Pass the runtime config (grpc + clickhouse sections) as argv[1] → SERVER mode.
    command: ["/etc/sentinel/config.yaml"]
    environment:
      CONTRACTS_DIR: /contracts/generator/v1
      CLICKHOUSE_URL: "http://clickhouse:8123"
    volumes:
      - ./contracts:/contracts:ro
      - ./services/collector-rust/config.docker.yaml:/etc/sentinel/config.yaml:ro
      # The role password (T18). Gitignored, created from
      # infra/secrets/ch_password.example, and mounted read-only at the path
      # config.docker.yaml names. The config carries the PATH; the value lives only
      # here and in the container's memory.
      - ./infra/secrets/ch_password:/etc/sentinel/secrets/ch_password:ro
    ports:
      # Local host access only. Generator and flow-ui use the private Compose network.
      - "127.0.0.1:${COLLECTOR_OTLP_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${COLLECTOR_METRICS_HOST_PORT:-9090}:9090"   # Prometheus collector metrics
    networks:
      default:
        aliases: ["collector"]
    depends_on:
      clickhouse:
        condition: service_healthy
    # No `healthcheck:` here, and that is a constraint rather than an omission.
    # The runtime stage is gcr.io/distroless/static-debian12 — no shell, no wget,
    # no curl — so there is no in-container command for Docker to run. Readiness is
    # therefore asserted from the host: `make up` polls
    # http://127.0.0.1:$COLLECTOR_METRICS_HOST_PORT/metrics and fails with the
    # collector's logs if it never answers. Consequence: nothing can depend on this
    # service with `condition: service_healthy`, which is fine — flow-ui and HyperDX
    # must not (invariant 09), and the generator is driven after `make up` returns.

  flow-ui:
    build:
      context: ./services/flow-ui
    image: sentinel-flow-ui:dev
    environment:
      # The browser never reaches these two directly: the collector's /metrics server sets
      # no CORS header and neither does ClickHouse, so a cross-origin fetch from the page
      # would be blocked. flow-ui is the only reader of both.
      COLLECTOR_METRICS_URL: "http://collector:9090/metrics"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: bronze
      # Reader credentials (T18). `sentinel_reader` is SELECT-only, and its
      # `system.tables`/`system.columns` grants are what the Flow board's Silver box
      # is drawn from. The password is a PATH; the value is only in the mount below.
      CLICKHOUSE_USER: sentinel_reader_u
      CLICKHOUSE_PASSWORD_FILE: /etc/sentinel/secrets/ch_password
    volumes:
      - ./infra/secrets/ch_password:/etc/sentinel/secrets/ch_password:ro
      # Pod 1's declared topology, read-only. The graph is drawn from the producer's
      # own config rather than redrawn here, so the picture cannot drift from it.
      - ./services/generator-python/config:/app/generator-config:ro
      # The collector's own config, read-only. `contract.grpc_validation` is not exposed as
      # a metric, so the receive-boundary policy can only be read from the file that sets
      # it — and the contract board's headline is that policy.
      - ./services/collector-rust/config.docker.yaml:/app/collector-config.yaml:ro
    ports:
      - "127.0.0.1:${FLOW_UI_HOST_PORT:-8080}:8080"
    # python:3.12-slim ships no curl and no wget, so the probe is the interpreter
    # that is already here. /healthz always answers 200 and reports `collector` and
    # `clickhouse` as fields (NFR-05: it degrades rather than crashing), so this is
    # a liveness check for the UI process — not an assertion that its upstreams are
    # up. That distinction is deliberate: a red ClickHouse box is something to look
    # at in the UI, not a reason for Compose to call the UI unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    depends_on:
      clickhouse:
        condition: service_healthy

  # HyperDX (ADR-0011): a second read-layer UI beside flow-ui, wired straight to
  # ClickHouse. Only the UI+API image runs here. ClickStack's all-in-one and local
  # images bundle their own ClickHouse and OTel collector; either would be a second
  # database and a second ingestion path, so neither is used. Ingestion stays with
  # collector-rust, and nothing else depends on this service being up.
  hyperdx-mongo:
    image: mongo:5.0.32-focal
    # HyperDX keeps users, saved searches, dashboards and alerts here. It is its own
    # metadata, never telemetry, and it has no host port: private network only.
    volumes:
      - hyperdx_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  hyperdx:
    image: hyperdx/hyperdx:2.40.0
    # Our wrapper builds DEFAULT_CONNECTIONS from the password file, then hands off
    # to the image's own entrypoint (/etc/local/entry.sh).
    entrypoint: ["sh", "/etc/hyperdx/entrypoint.sh"]
    environment:
      MONGO_URI: "mongodb://hyperdx-mongo:27017/hyperdx"
      # Must equal the URL typed into the browser, or login redirects break.
      FRONTEND_URL: "http://127.0.0.1:${HYPERDX_HOST_PORT:-8082}"
      HYPERDX_LOG_LEVEL: info
      USAGE_STATS_ENABLED: "false"
      # Reader credentials. `sentinel_hyperdx_u` is SELECT-only (migration 0007).
      # The password is a PATH; the value is only in the mount below.
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: sentinel_hyperdx_u
      CLICKHOUSE_PASSWORD_FILE: /etc/sentinel/secrets/ch_password
    volumes:
      - ./infra/secrets/ch_password:/etc/sentinel/secrets/ch_password:ro
      # The sources HyperDX opens with, mapped onto the bronze tables. Read once to
      # bootstrap an EMPTY Mongo; after that HyperDX owns them (see ADR-0011).
      - ./infra/hyperdx/sources.json:/etc/hyperdx/sources.json:ro
      - ./infra/hyperdx/entrypoint.sh:/etc/hyperdx/entrypoint.sh:ro
    ports:
      # Local host access only. 8080 is flow-ui's default; HyperDX takes 8082 and
      # leaves 8081 free, because 8081 is the port a crowded machine reaches for
      # first when 8080 is gone — including to move flow-ui itself
      # (FLOW_UI_HOST_PORT=8081). Both are overridable; invariant 03 forbids a clash.
      - "127.0.0.1:${HYPERDX_HOST_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      clickhouse:
        condition: service_healthy
      hyperdx-mongo:
        condition: service_healthy

  generator:
    build:
      context: ./services/generator-python
    image: sentinel-generator:dev
    environment:
      CONTRACTS_DIR: /contracts/generator/v1
    volumes:
      - ./contracts:/contracts:ro
    # No long-running command — driven on demand by `make generate` /
    # `make generate-stream` (docker compose run --rm generator --scenario ...
    # --otlp-endpoint http://collector:4317), which is why `make up` BUILDS this
    # image but does not `up` it: a one-shot CLI brought up as a service would run
    # `otelgen --help` and exit, and show in `docker compose ps` as Exited — a
    # healthy stack that reads as a broken one.

volumes:
  hyperdx_mongo_data: {}
