[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otelgen"
version = "0.1.0"
description = "Containerised, config-driven OTel synthetic-telemetry generator for Sentinel"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "clickhouse-connect>=0.7.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "testcontainers>=4.5.0",
    "jsonschema>=4.21.0",
]

[project.scripts]
otelgen = "otelgen.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Integration test intentionally imports after a pytest.importorskip/skip guard.
"tests/integration/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
