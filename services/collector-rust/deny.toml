# cargo-deny config — license + advisory + dependency policy for the Rust
# component. Roughly the UV-equivalent of `pip-audit` + `pip-licenses`.
# Install once: `cargo install --locked cargo-deny`.
# Run with `cargo deny check` (from inside services/collector-rust/) or
# `just deny` / `just rust-deny`.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2025-0134 — rustls-pemfile 2.2.0 is unmaintained (its functionality
    # moved into rustls-pki-types). Unmaintained, NOT a vulnerability: there is no
    # known exploit, and cargo-deny classes it under `unmaintained`, not
    # `vulnerability`.
    #
    # It is not in the shipped collector. `cargo tree -i rustls-pemfile` matches
    # nothing on the default feature set and resolves only under --all-features,
    # via tonic 0.12's optional `tls` feature, which this crate enables solely
    # through `tls-spike` — T04's compile-only TLS experiment, deliberately out of
    # `default` and slated for deletion with T42 (TLS deferred by DEC-A4). CI hits
    # it because `cargo deny check --all-features` turns that feature on.
    #
    # Not removable by a bump: 2.2.0 is the last release, so the advisory applies
    # to every 2.x. Dropping it needs tonic 0.13+, which drags the whole
    # opentelemetry 0.27 stack (-proto, -otlp, _sdk) forward — a contract-adjacent
    # change that does not belong in this PR.
    #
    # Scoped to this one advisory ID; the `unmaintained` lint stays on for
    # everything else. Added 2026-10-08. Remove with T42, or sooner if the
    # OTel/tonic bump lands first — whichever deletes the `tls-spike` feature.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# copyleft (GPL/LGPL/AGPL) is implicitly denied by omission from `allow`.

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []  # add bans like { name = "openssl", reason = "use rustls instead" }

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
