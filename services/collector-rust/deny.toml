# cargo-deny config — license + advisory + dependency policy for the Rust
# component. Roughly the UV-equivalent of `pip-audit` + `pip-licenses`.
# Install once: `cargo install --locked cargo-deny`.
# Run with `cargo deny check` (from inside services/collector-rust/) or
# `just deny` / `just rust-deny`.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []  # add RUSTSEC advisory IDs here only with an Issue link

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# copyleft (GPL/LGPL/AGPL) is implicitly denied by omission from `allow`.

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []  # add bans like { name = "openssl", reason = "use rustls instead" }

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
