services:

  # ClickHouse — receives data from the Go collector via native TCP :9000
  # HTTP Play UI available at http://localhost:8123/play
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"   # HTTP interface + /play UI
      - "9000:9000"   # Native TCP (used by collector)
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: otelgen
      CLICKHOUSE_PASSWORD: otelgen_secret
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user=otelgen", "--password=otelgen_secret", "--query=SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Auto-run schema init on first start (files applied alphabetically: 001→002→003)
      - ./infra/clickhouse/ddl:/docker-entrypoint-initdb.d:ro

  # Go OTel Collector — receives OTLP gRPC from OTelGen (Pod 1)
  collector:
    build: .
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "8080:8080"   # HTTP health/ready
    environment:
      CLICKHOUSE_DSN: "clickhouse://otelgen:otelgen_secret@clickhouse:9000/default"
      GRPC_PORT: "4317"
      HTTP_PORT: "8080"
      BATCH_SIZE: "100"
      FLUSH_INTERVAL_MS: "500"
      LOG_FORMAT: "json"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # HyperDX (ClickStack) — observability UI compartilhando nosso ClickHouse
  # UI:        http://localhost:8000
  # OTLP gRPC: localhost:4316  (nosso collector usa :4317)
  # OTLP HTTP: localhost:4318
  #
  # CLICKHOUSE_ENDPOINT aponta o OTel Collector interno do HyperDX para nosso CH.
  # DEFAULT_CONNECTIONS usa nome "Local ClickHouse" (hardcoded nos DEFAULT_SOURCES do entrypoint).
  # Adiciona também "Sentinel ClickHouse" (user otelgen) para consultas manuais às nossas tabelas.
  # make sender-hyperdx envia dados via OTLP gRPC :4316 → gravados em default.otel_* no nosso CH.
  hyperdx:
    image: hyperdx/hyperdx-all-in-one:latest
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8000:8080"   # Web UI
      - "4316:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      NODE_ENV: "production"
      # "Local ClickHouse" (localhost:8123) = CH interno do HyperDX — usado pelos DEFAULT_SOURCES do entrypoint.
      # "Sentinel ClickHouse" = nosso CH externo com user otelgen — para consultas manuais às tabelas sentinel.*.
      # make sender-hyperdx → OTLP :4316 → CH interno → visível no HyperDX UI
      # make sender        → nosso collector :4317 → default.otel_* → ClickHouse Play ou Sentinel ClickHouse
      DEFAULT_CONNECTIONS: '[{"name":"Local ClickHouse","host":"http://localhost:8123","username":"default","password":""},{"name":"Sentinel ClickHouse","host":"http://clickhouse:8123","username":"otelgen","password":"otelgen_secret"}]'
    volumes:
      - hyperdx_data:/data
    restart: unless-stopped

volumes:
  clickhouse_data:
  hyperdx_data:
